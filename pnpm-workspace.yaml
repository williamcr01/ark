packages:
  - 'apps/*'
  - 'packages/*'

# concurrently@10 pins shell-quote@1.8.4 exactly; override until upstream bumps.
# Patched transitive versions pinned until upstreams bump.
overrides:
  # pptxgenjs 4.0.1 declares @types/node, https, and image-size as runtime
  # dependencies its shipped bundles never reference - the only require('sizeof')
  # sits inside a commented-out function. Dropping them from resolution removes a
  # vulnerable transitive (GHSA-w3rx-r6r6-pgpr, GHSA-5p2g-fcmc-qvqq) and two dead
  # installs. A patch would not do: pnpm resolves dependencies from registry
  # metadata before a patch is applied, so the lockfile - and `pnpm audit` with
  # it - would still carry them.
  pptxgenjs>@types/node: '-'
  pptxgenjs>https: '-'
  pptxgenjs>image-size: '-'
  shell-quote: 1.9.0
  postcss: 8.5.18
  brace-expansion: 5.0.9
  fast-uri: 3.1.5
  ip-address: 10.3.1
  'undici@>=7.0.0 <7.29.0': 7.29.0
  js-yaml: 4.3.1
  'nanoid@>=3.0.0 <4.0.0': 3.3.18
  'nanoid@>=4.0.0 <6.0.0': 5.1.16
  # GHSA-c83g-rgw3-j3cx / GHSA-73wf-gq98-2v4g: unbounded cache + prototype write.
  browserslist: 4.28.7

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@3.0.155'
  - '@ai-sdk/google@3.0.98'
  - ai@6.0.233
  - postcss@8.5.18
  - brace-expansion@5.0.9
  - fast-uri@3.1.5
  - ip-address@10.3.1
  - undici@7.29.0
  - nanoid@3.3.18
  - nanoid@5.1.16
  - browserslist@4.28.7
