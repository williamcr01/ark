packages:
  - 'apps/*'
  - 'packages/*'

# concurrently@10 pins shell-quote@1.8.4 exactly; override until upstream bumps.
# Patched transitive versions pinned until upstreams bump.
overrides:
  "pptxgenjs>https": "-"
  "pptxgenjs>image-size": "-"
  shell-quote: 1.9.0
  postcss: 8.5.18
  brace-expansion: 5.0.9
  fast-uri: 3.1.5
  ip-address: 10.3.1
  'undici@>=7.0.0 <7.29.0': 7.29.0
  js-yaml: 4.3.1
  'nanoid@>=3.0.0 <4.0.0': 3.3.18
  'nanoid@>=4.0.0 <6.0.0': 5.1.16

allowBuilds:
  electron: true
  electron-winstaller: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@3.0.155'
  - '@ai-sdk/google@3.0.98'
  - ai@6.0.233
  - postcss@8.5.18
  - brace-expansion@5.0.9
  - fast-uri@3.1.5
  - ip-address@10.3.1
  - undici@7.29.0
  - nanoid@3.3.18
  - nanoid@5.1.16

patchedDependencies:
  pptxgenjs@4.0.1: patches/pptxgenjs@4.0.1.patch
