name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.scope.outputs.run_ci }}
      full: ${{ steps.scope.outputs.full }}
      build: ${{ steps.scope.outputs.build }}
      test: ${{ steps.scope.outputs.test }}
      smoke: ${{ steps.scope.outputs.smoke }}
      reason: ${{ steps.scope.outputs.reason }}
      base_sha: ${{ steps.scope.outputs.base_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Test CI helper scripts
        run: node --test scripts/ci-test-scope.test.mjs scripts/profile-editor-drag.test.mjs

      - name: Select CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FORCE_FULL: ${{ github.event_name != 'pull_request' }}
        run: |
          echo "run_ci=true" >> "$GITHUB_OUTPUT"
          echo "base_sha=$BASE_SHA" >> "$GITHUB_OUTPUT"

          if [[ "$FORCE_FULL" == "true" ]]; then
            case "$EVENT_NAME" in
              push) reason="Full validation for push to main." ;;
              workflow_dispatch) reason="Full validation requested manually." ;;
              *) reason="Full validation for $EVENT_NAME event." ;;
            esac
            node scripts/ci-test-scope.mjs \
              --full-reason "$reason" \
              --github-output "$GITHUB_OUTPUT" \
              --github-summary "$GITHUB_STEP_SUMMARY"
          else
            node scripts/ci-test-scope.mjs \
              --base "$BASE_SHA" \
              --github-output "$GITHUB_OUTPUT" \
              --github-summary "$GITHUB_STEP_SUMMARY"
          fi

  # Cheap static checks share one install and remain the broad PR safety net.
  quality:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - name: No CI work required
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci != 'true'
        env:
          CI_REASON: ${{ needs.changes.outputs.reason }}
        run: echo "$CI_REASON"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true'

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true'
        with:
          node-version: 22
          cache: pnpm

      - if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true'
        run: pnpm lockfile:check
      - if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true'
        run: pnpm lint
      - if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true'
        run: pnpm format:check
      # High/critical only; see package.json "audit" script. Moderate/low are reviewed separately.
      - if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true'
        run: pnpm run audit
      - if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true'
        run: pnpm openapi:check

  build:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Build not required
        if: needs.changes.result == 'success' && (needs.changes.outputs.run_ci != 'true' || needs.changes.outputs.build != 'true')
        env:
          CI_REASON: ${{ needs.changes.outputs.reason }}
        run: echo "$CI_REASON"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.build == 'true'

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.build == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.build == 'true'
        with:
          node-version: 22
          cache: pnpm

      - if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.build == 'true'
        run: pnpm install --frozen-lockfile
      - if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.build == 'true'
        run: pnpm build

  test:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Unit tests not required
        if: needs.changes.result == 'success' && (needs.changes.outputs.run_ci != 'true' || needs.changes.outputs.test != 'true')
        env:
          CI_REASON: ${{ needs.changes.outputs.reason }}
        run: echo "$CI_REASON"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.test == 'true'
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.test == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.test == 'true'
        with:
          node-version: 22
          cache: pnpm

      - if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.test == 'true'
        run: pnpm install --frozen-lockfile

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.test == 'true'
        with:
          path: node_modules/.cache/ark-test-compile
          key: ${{ runner.os }}-node22-vitest-compile-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node22-vitest-compile-

      - name: Full unit test suite
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.test == 'true' && needs.changes.outputs.full == 'true'
        run: pnpm test

      - name: Affected unit test suites
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.test == 'true' && needs.changes.outputs.full != 'true'
        env:
          BASE_SHA: ${{ needs.changes.outputs.base_sha }}
        run: pnpm test:affected --base "$BASE_SHA" --github-summary "$GITHUB_STEP_SUMMARY"

  smoke:
    needs: changes
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_DISABLE_SANDBOX: 'true'
    steps:
      - name: Require successful change classification
        if: needs.changes.result != 'success'
        run: exit 1

      - name: Desktop smoke not required
        if: needs.changes.result == 'success' && (needs.changes.outputs.run_ci != 'true' || needs.changes.outputs.smoke != 'true')
        env:
          CI_REASON: ${{ needs.changes.outputs.reason }}
        run: echo "$CI_REASON"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.smoke == 'true'

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.smoke == 'true'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.smoke == 'true'
        with:
          node-version: 22
          cache: pnpm

      - if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.smoke == 'true'
        run: pnpm install --frozen-lockfile

      - name: Desktop smoke diagnostics
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.smoke == 'true'
        run: |
          node --version
          pnpm --filter @ark/desktop exec electron --version
          df -h / /tmp
          free -h || true

      - name: Smoke - Electron app
        if: needs.changes.result == 'success' && needs.changes.outputs.run_ci == 'true' && needs.changes.outputs.smoke == 'true'
        uses: nick-fields/retry@ce71cc2ab81d554ebbe88c79ab5975992d79ba08 # v3.0.2
        with:
          timeout_minutes: 8
          max_attempts: 3
          retry_wait_seconds: 15
          command: pnpm smoke:desktop
