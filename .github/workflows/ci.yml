name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap static checks share one install so PRs stay gated by `test` (~3–4 min),
  # not by N parallel setup tax.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm lockfile:check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm audit
      - run: pnpm openapi:check

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Live Chromium thumbnail coverage runs in test-live-chromium (main only).
      - run: pnpm test

  test-live-chromium:
    # API-level Chromium renderer coverage: main pushes only (not PRs).
    # UI e2e thumbnail smoke stays in smoke-extended on the same trigger.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Budget for up to 3 attempts of the live Chromium suite.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Browser diagnostics
        run: |
          node --version
          google-chrome --version || /usr/bin/google-chrome --version
          test -x /usr/bin/google-chrome
          df -h / /tmp
          free -h || true

      - name: Live Chromium thumbnail renderer tests
        uses: nick-fields/retry@v3
        env:
          ARK_CHROMIUM_PATH: /usr/bin/google-chrome
          ARK_CHROMIUM_NO_SANDBOX: 'true'
          ARK_LIVE_CHROMIUM_TESTS: '1'
        with:
          timeout_minutes: 12
          max_attempts: 3
          retry_wait_seconds: 15
          command: pnpm test:live-chromium

  smoke:
    runs-on: ubuntu-latest
    # PR-blocking smoke only: plain CSS upload / nav / Present.
    # Reveal, full-JS, manual-edit, and thumbnail e2e run in smoke-extended.
    timeout-minutes: 20
    env:
      ARK_CHROMIUM_PATH: /usr/bin/google-chrome
      ARK_CHROMIUM_NO_SANDBOX: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Browser smoke diagnostics
        run: |
          # runner.temp is only valid in step contexts, not job-level env.
          echo "ARK_SMOKE_ARTIFACTS_DIR=${{ runner.temp }}/ark-smoke-artifacts" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ark-smoke-artifacts"
          node --version
          google-chrome --version || /usr/bin/google-chrome --version
          test -x /usr/bin/google-chrome
          df -h / /tmp
          free -h || true

      # Browser smokes are flaky under shared CI runners; retry before failing.
      - name: Smoke - plain CSS
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 5
          retry_wait_seconds: 15
          command: pnpm smoke:plain-css

      - name: Upload browser smoke artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/ark-smoke-artifacts
          if-no-files-found: warn
          retention-days: 7

  smoke-extended:
    # Heavier browser suites: main pushes only (not PRs).
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Budget for 4 suites with up to 5 attempts each on flaky runners.
    timeout-minutes: 90
    env:
      ARK_CHROMIUM_PATH: /usr/bin/google-chrome
      ARK_CHROMIUM_NO_SANDBOX: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Browser smoke diagnostics
        run: |
          echo "ARK_SMOKE_ARTIFACTS_DIR=${{ runner.temp }}/ark-smoke-artifacts" >> "$GITHUB_ENV"
          mkdir -p "${{ runner.temp }}/ark-smoke-artifacts"
          node --version
          google-chrome --version || /usr/bin/google-chrome --version
          test -x /usr/bin/google-chrome
          df -h / /tmp
          free -h || true

      - name: Smoke - Reveal runtime
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 5
          retry_wait_seconds: 15
          command: pnpm smoke:reveal-runtime

      - name: Smoke - full-JS bridge
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 8
          max_attempts: 5
          retry_wait_seconds: 15
          command: pnpm smoke:full-js-bridge

      - name: Smoke - manual edit
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 5
          retry_wait_seconds: 15
          command: pnpm smoke:manual-edit

      # UI e2e for rendered PNG thumbnails. API renderer coverage is
      # test-live-chromium on main pushes; both stay off the PR critical path.
      - name: Smoke - thumbnails
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 15
          command: pnpm smoke:thumbnails

      - name: Upload browser smoke artifacts (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-extended-artifacts-${{ github.run_id }}
          path: ${{ runner.temp }}/ark-smoke-artifacts
          if-no-files-found: warn
          retention-days: 7
