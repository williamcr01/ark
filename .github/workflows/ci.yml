name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm lockfile:check
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm audit
      - run: pnpm build
      - run: pnpm test
      - run: pnpm openapi:check
      - run: pnpm smoke:browser
        env:
          ARK_CHROMIUM_PATH: /usr/bin/google-chrome
