<!doctype html>
<html
  lang="en"
  data-ark-preview="full-js"
  data-ark-runtime="chart"
  data-ark-runtime-lib="chart.js"
  data-ark-runtime-version="4.5.1"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chart Registry Deck</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      section.slide {
        display: none;
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        padding: 4vh 6vw;
        flex-direction: column;
        gap: 2vh;
      }

      section.slide.active {
        display: flex;
      }

      h1,
      h2 {
        margin: 0;
        font-weight: 650;
        letter-spacing: -0.02em;
      }

      .chart-wrap {
        flex: 1;
        min-height: 0;
        position: relative;
      }

      canvas {
        width: 100% !important;
        height: 100% !important;
      }
    </style>
  </head>
  <body>
    <!-- slide: Quarterly revenue -->
    <section class="slide active" aria-hidden="false">
      <h1>Quarterly revenue</h1>
      <div class="chart-wrap">
        <canvas id="revenueChart" role="img" aria-label="Bar chart of quarterly revenue"></canvas>
      </div>
    </section>
    <!-- slide: Pipeline mix -->
    <section class="slide" aria-hidden="true">
      <h2>Pipeline mix</h2>
      <div class="chart-wrap">
        <canvas id="pipelineChart" role="img" aria-label="Doughnut chart of pipeline mix"></canvas>
      </div>
    </section>
    <script src="/api/runtimes/chart.js/4.5.1/chart.umd.min.js"></script>
    <script>
      ;(() => {
        const slides = [...document.querySelectorAll('section.slide')]
        let index = 0

        function setSlide(nextIndex) {
          index = Math.max(0, Math.min(slides.length - 1, nextIndex))
          slides.forEach((slide, i) => {
            const active = i === index
            slide.classList.toggle('active', active)
            slide.setAttribute('aria-hidden', String(!active))
          })
          document.dispatchEvent(new CustomEvent('ark:deck-slide-change', { detail: { index } }))
        }

        document.addEventListener('ark:deck-goto', (event) => setSlide(event.detail.index))

        const commonOptions = {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { labels: { color: '#e2e8f0' } },
          },
        }

        new Chart(document.getElementById('revenueChart'), {
          type: 'bar',
          data: {
            labels: ['Q1', 'Q2', 'Q3', 'Q4'],
            datasets: [
              {
                label: 'Revenue ($M)',
                data: [4.2, 5.1, 4.8, 6.3],
                backgroundColor: ['#38bdf8', '#34d399', '#fbbf24', '#f472b6'],
              },
            ],
          },
          options: {
            ...commonOptions,
            scales: {
              x: { ticks: { color: '#cbd5e1' }, grid: { color: 'rgba(148,163,184,0.2)' } },
              y: { ticks: { color: '#cbd5e1' }, grid: { color: 'rgba(148,163,184,0.2)' } },
            },
          },
        })

        new Chart(document.getElementById('pipelineChart'), {
          type: 'doughnut',
          data: {
            labels: ['New', 'Expansion', 'Renewal'],
            datasets: [
              {
                data: [42, 33, 25],
                backgroundColor: ['#38bdf8', '#a78bfa', '#34d399'],
              },
            ],
          },
          options: commonOptions,
        })

        setSlide(0)
        window.chartRegistryDeckBooted = true
      })()
    </script>
  </body>
</html>
