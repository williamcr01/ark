<!doctype html>
<html lang="en" data-ark-deck="nav">
  <head>
    <meta charset="UTF-8" />
    <title>Full JS Deck</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family: system-ui, sans-serif;
      }

      section.slide {
        display: none;
        width: 100vw;
        height: 100vh;
        align-items: center;
        justify-content: center;
      }

      section.slide.active {
        display: flex;
      }
    </style>
  </head>
  <body>
    <section class="slide active" aria-hidden="false">
      <h1>Scripted opening</h1>
    </section>
    <section class="slide" aria-hidden="true">
      <h2>Scripted detail</h2>
    </section>
    <div aria-hidden="true">
      <span id="currentSlide">01</span>
      <span id="totalSlides">02</span>
      <span id="progressBar"></span>
      <button id="prevSlide" type="button">Previous</button>
      <button id="nextSlide" type="button">Next</button>
    </div>
    <script>
      window.fullJsDeckBooted = true
      ;(() => {
        const slides = [...document.querySelectorAll('section.slide')]
        let index = 0

        function setSlide(nextIndex) {
          index = Math.max(0, Math.min(slides.length - 1, nextIndex))
          slides.forEach((slide, i) => {
            const active = i === index
            slide.classList.toggle('active', active)
            slide.setAttribute('aria-hidden', String(!active))
          })
          document.dispatchEvent(new CustomEvent('ark:deck-slide-change', { detail: { index } }))
        }

        document.addEventListener('ark:deck-goto', (event) => setSlide(event.detail.index))
        setSlide(0)
      })()
    </script>
  </body>
</html>
