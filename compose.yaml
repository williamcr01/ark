services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ark
      POSTGRES_PASSWORD: ark
      POSTGRES_DB: ark
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ark -d ark']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - ark-postgres:/var/lib/postgresql/data

volumes:
  ark-postgres:
